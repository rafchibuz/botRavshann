<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Twitch Control Panel</title>
    <style>
        :root {
            --bg: #0e0e10;
            --surface: #18181b;
            --border: #3a3a3d;
            --text: #efeff1;
            --muted: #adadb8;
            --purple: #9147ff;
            --purple-light: #a970ff;
            --red: #eb0400;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,.45);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: var(--purple-light);
            text-align: center;
        }
        p {
            margin: 0 0 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            background: #0e0e10;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            border-color: var(--purple);
        }
        button {
            width: 100%;
            background: var(--purple);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #772ce8; }
        #error {
            display: none;
            margin-top: 14px;
            text-align: center;
            color: var(--red);
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Twitch Bot Panel</h1>
        <p>Введите пароль для доступа к панели управления</p>
        <form id="login-form">
            <label for="password">Пароль</label>
            <input type="password" id="password" autocomplete="current-password" autofocus required>
            <button type="submit">Войти</button>
        </form>
        <div id="error"></div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value })
            });

            if (res.ok) {
                window.location.href = '/';
                return;
            }

            const data = await res.json().catch(() => ({}));
            errorEl.textContent = data.message || 'Неверный пароль';
            errorEl.style.display = 'block';
        });
    </script>
</body>
</html>
